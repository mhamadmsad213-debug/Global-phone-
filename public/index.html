<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Global Directory</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>Pi.init({version:"2.0",sandbox:false});</script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white">
<div class="bg-gradient-to-b from-blue-600 to-blue-900 text-center py-14 px-6">
<button onclick="loginPi()" id="piBtn" class="bg-yellow-400 text-black font-bold py-3 px-8 rounded-xl mb-6">تسجيل الدخول بـ Pi</button>
<h1 class="text-3xl font-bold mb-3">Phone Global 🌍 Directory</h1>
<p class="text-lg leading-8">سجل اسم منشأتك أو شركتك في أي مكان بالعالم<br>ليتمكن الجميع من الوصول إليك بسهولة عبر دليل الهاتف العالمي</p>
</div>
<div class="p-6 grid grid-cols-2 gap-4 max-w-2xl mx-auto text-center">
<div class="bg-[#1e293b] rounded-2xl p-6"><div class="text-3xl font-bold text-blue-400">1,234,567</div><div>إجمالي الأرقام</div></div>
<div class="bg-[#1e293b] rounded-2xl p-6"><div class="text-3xl font-bold text-blue-400">195</div><div>الدول المتاحة</div></div>
</div>
<script>
async function loginPi(){
let b=document.getElementById('piBtn');b.textContent='جاري التحقق...';
try{let a=await Pi.authenticate(['username','payments'],function(p){});alert('أهلا '+a.user.username);b.textContent='مرحبا '+a.user.username;}catch(e){alert('فشل: '+e.message);b.textContent='تسجيل الدخول بـ Pi';}
}
</script>
</body>
</html>
